# Werktags früh: Marktdaten des letzten Handelstags für den Tagesbericht sammeln.
name: Marktdaten für Tagesbericht
on:
  schedule:
    - cron: '20 4 * * 1-5'   # 04:20 UTC = 06:20 Uhr Sommerzeit / 05:20 Uhr Winterzeit
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Daten sammeln
        run: python3 scripts/market_data.py
      - name: Speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/data/market.json
          git diff --cached --quiet || (git commit -m "Marktdaten $(date -u +%F)" && git push)
