# Veröffentlicht den Server (server/) bei Cloudflare, sobald sich dort etwas ändert.
# Benötigte Repository-Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, FINNHUB_KEY
name: Server veröffentlichen
on:
  push:
    branches: [main]
    paths: ['server/**', 'js/trend.js', '.github/workflows/deploy-server.yml']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prüfen, ob Cloudflare eingerichtet ist
        id: check
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: if [ -n "$TOKEN" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; else echo "Cloudflare-Secrets fehlen noch, überspringe."; fi
      - name: Deploy
        if: steps.check.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: server
          secrets: FINNHUB_KEY
        env:
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
      - name: Server testen
        if: steps.check.outputs.ready == 'true'
        run: |
          sleep 5
          code=$(curl -s -o /tmp/q.json -w '%{http_code}' -H 'Origin: https://jochen19xx.github.io' \
            "https://aktiengurus.veith-jochen.workers.dev/finnhub/quote?symbol=SOXL")
          echo "HTTP $code"
          python3 -c "import json;d=json.load(open('/tmp/q.json'));print('SOXL-Kurs vorhanden:', bool(d.get('c')) or bool(d.get('pc')))"
          test "$code" = "200"
          curl -s -H 'Origin: https://jochen19xx.github.io' "https://aktiengurus.veith-jochen.workers.dev/holdings" -o /tmp/h.json
          python3 -c "import json;d=json.load(open('/tmp/h.json'));print('Top 10 Stand', d.get('asOf'), d.get('error','')); [print(' ', h['symbol'], h['weight'], h['name']) for h in d.get('holdings',[])]"
          python3 -c "import json,sys;sys.exit(0 if len(json.load(open('/tmp/h.json')).get('holdings',[]))>=5 else 1)"
          curl -s -H 'Origin: https://jochen19xx.github.io' "https://aktiengurus.veith-jochen.workers.dev/push/key" -o /tmp/k.json
          python3 -c "import json,sys;k=json.load(open('/tmp/k.json')).get('publicKey','');print('Push-Schlüssel vorhanden:', len(k)>80);sys.exit(0 if len(k)>80 else 1)"
          curl -s -H 'Origin: https://jochen19xx.github.io' "https://aktiengurus.veith-jochen.workers.dev/candles?symbol=SOXL" -o /tmp/c.json
          python3 -c "import json,sys;c=json.load(open('/tmp/c.json')).get('candles',[]);print('Tageskerzen:', len(c), c[-1] if c else '');sys.exit(0 if len(c)>=60 else 1)"
